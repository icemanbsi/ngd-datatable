<ngd-datatable-row 
    *ngFor="let item of data; let i=index">
    <ngd-datatable-cell 
        *ngFor="let column of columns"
        [attr.style]="getStyles(column)"
        [rowIndex]="i"
        [page]="page"
        [pageLimit]="pageLimit"
        [column]="column"
        [item]="item">
    </ngd-datatable-cell>
</ngd-datatable-row>
